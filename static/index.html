<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>VRM Catalog</title>
<link rel="stylesheet" href="app.css">
<!-- Import map for the VRM viewer. @pixiv/three-vrm's module build uses bare
     imports, so the browser needs one shared three instance. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.5/lib/three-vrm.module.js"
  }
}
</script>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="catalog-intro">
      <h1>VRM catalog</h1>
      <p>Find NFT collections with working VRM files and clear usage terms.</p>
    </div>

    <div class="controls" role="search" aria-label="Catalog filters">
      <label class="search-wrap">
        <span class="sr-only">Search collections</span>
        <input
          type="search"
          id="search"
          placeholder="Search collections, creators, or contracts"
          autocomplete="off"
          spellcheck="false"
          oninput="onSearch()"
        >
      </label>

      <label>
        <span class="sr-only">Filter by chain</span>
        <select id="f-chain" onchange="filter()" aria-label="Filter by chain">
          <option value="">All chains</option>
          <option value="ethereum">Ethereum</option>
          <option value="base">Base</option>
          <option value="optimism">Optimism</option>
          <option value="polygon">Polygon</option>
          <option value="arbitrum">Arbitrum</option>
          <option value="shape">Shape</option>
          <option value="ape_chain">ApeChain</option>
          <option value="multi">Multi-chain</option>
        </select>
      </label>

      <label>
        <span class="sr-only">Filter by license</span>
        <select id="f-license" onchange="filter()" aria-label="Filter by license">
          <option value="">All licenses</option>
          <option value="green">Open / CC0</option>
          <option value="yellow">Holder-gated</option>
          <option value="red">Restricted</option>
          <option value="unknown">Unknown</option>
        </select>
      </label>

      <label>
        <span class="sr-only">Filter by VRM status</span>
        <select id="f-vrm" onchange="filter()" aria-label="Filter by VRM status">
          <option value="">Any VRM status</option>
          <option value="live">Verified</option>
          <option value="dead">Unreachable</option>
          <option value="nourl">No VRM URL</option>
        </select>
      </label>

      <label>
        <span class="sr-only">Sort collections</span>
        <select id="f-sort" onchange="filter()" aria-label="Sort collections">
          <option value="name">Sort: name</option>
          <option value="release_date">Sort: launch date</option>
          <option value="total_supply">Sort: supply</option>
          <option value="vrm">Sort: VRM status</option>
          <option value="avatars_total">Sort: files indexed</option>
        </select>
      </label>
    </div>
  </div>
</header>

<main>
  <section id="collectionsView" aria-labelledby="collectionsHeading">
    <h2 id="collectionsHeading" class="sr-only">Collections</h2>
    <div class="result-bar">
      <span class="result-count" id="collCount" aria-live="polite"></span>
    </div>
    <div class="collection-list" id="collectionsGrid">
      <div class="loading-msg">Loading catalog…</div>
    </div>
    <div class="empty" id="emptyState" style="display:none">No collections match these filters.</div>
  </section>
</main>

<footer class="site-credits">
  Curated with data from
  <a href="https://github.com/toxsam/open-source-avatars" target="_blank" rel="noopener">Open Source Avatars</a>
  and
  <a href="https://github.com/itsmetamike/awesome-3D-avatar-collections" target="_blank" rel="noopener">awesome-3D-avatar-collections</a>.
  VRM viewer by <a href="https://github.com/pixiv/three-vrm" target="_blank" rel="noopener">pixiv/three-vrm</a>.
</footer>

<!-- Image preview -->
<div id="imgModal" role="dialog" aria-modal="true" aria-label="Image preview" onclick="closeImgModal()">
  <button id="imgModalClose" type="button" aria-label="Close image preview" onclick="closeImgModal()">×</button>
  <div id="imgModalContent">
    <img id="imgModalBanner" src="" alt="">
    <img id="imgModalImg" src="" alt="">
    <div id="imgModalLabel"></div>
  </div>
</div>

<!-- VRM viewer -->
<div id="vrmModal" role="dialog" aria-modal="true" aria-labelledby="vrmModalTitle">
  <div id="vrmModalContent">
    <div id="vrmModalHeader">
      <h3 id="vrmModalTitle">VRM viewer</h3>
      <button id="vrmModalClose" type="button" aria-label="Close VRM viewer" onclick="closeVrmModal()">×</button>
    </div>
    <div id="vrmCanvasContainer">
      <canvas id="vrmCanvas"></canvas>
      <div id="vrmLoading">Loading VRM…</div>
      <div id="vrmError"></div>
    </div>
    <div id="vrmModalFooter">
      <span id="vrmFooterInfo"></span>
      <a id="vrmFooterLink" href="#" target="_blank" rel="noopener">Open file ↗</a>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
