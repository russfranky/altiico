<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRM Collection Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<!-- Import map for the VRM viewer. @pixiv/three-vrm's module build uses bare
     `import * as THREE from "three"`, so the browser needs this mapping — and it
     guarantees ONE three instance (two copies break the VRM loader plugin). -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.5/lib/three-vrm.module.js"
  }
}
</script>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="controls">
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search collections, contracts, creators, descriptions…" oninput="onSearch()">
      </div>
      <select id="f-chain" onchange="filter()" title="Chain">
        <option value="">All chains</option>
        <option value="ethereum">Ethereum</option>
        <option value="base">Base</option>
        <option value="optimism">Optimism</option>
        <option value="polygon">Polygon</option>
        <option value="arbitrum">Arbitrum</option>
        <option value="shape">Shape</option>
        <option value="ape_chain">ApeChain</option>
        <option value="multi">Multi-chain</option>
      </select>
      <select id="f-license" onchange="filter()" title="Licence">
        <option value="">All licences</option>
        <option value="green">Open / CC0</option>
        <option value="yellow">Holder-gated</option>
        <option value="red">Restricted</option>
        <option value="unknown">Unknown</option>
      </select>
      <select id="f-vrm" onchange="filter()" title="VRM file status">
        <option value="">Any VRM status</option>
        <option value="live">Verified</option>
        <option value="dead">Unreachable</option>
        <option value="nourl">No VRM URL</option>
      </select>
      <select id="f-sort" onchange="filter()" title="Sort">
        <option value="name">Sort: Name</option>
        <option value="release_date">Sort: Launch date</option>
        <option value="total_supply">Sort: Supply</option>
        <option value="vrm">Sort: VRM status</option>
        <option value="avatars_total">Sort: Files indexed</option>
      </select>
    </div>
  </div>
</header>

<main>
  <!-- Collections -->
  <div id="collectionsView">
    <div class="result-bar">
      <span class="result-count" id="collCount"></span>
    </div>
    <div class="card-grid" id="collectionsGrid"></div>
    <div class="empty" id="emptyState" style="display:none">No collections match your filters.</div>
  </div>

</main>

<footer class="site-credits">
  Data curated by
  <a href="https://github.com/toxsam/open-source-avatars" target="_blank" rel="noopener">Open Source Avatars (ToxSam)</a> ·
  <a href="https://github.com/itsmetamike/awesome-3D-avatar-collections" target="_blank" rel="noopener">awesome-3D-avatar-collections (itsmetamike)</a> ·
  VRM spec by <a href="https://github.com/vrm-c/vrm-specification" target="_blank" rel="noopener">vrm-c</a> ·
  viewer by <a href="https://github.com/pixiv/three-vrm" target="_blank" rel="noopener">pixiv/three-vrm</a>
</footer>

<!-- Image preview modal -->
<div id="imgModal" onclick="closeImgModal()">
  <button id="imgModalClose" onclick="closeImgModal()">&times;</button>
  <div id="imgModalContent">
    <img id="imgModalBanner" src="" style="display:none" alt="">
    <img id="imgModalImg" src="" alt="">
    <div id="imgModalLabel"></div>
  </div>
</div>

<!-- VRM viewer modal -->
<div id="vrmModal">
  <div id="vrmModalContent">
    <div id="vrmModalHeader">
      <h3 id="vrmModalTitle">VRM Viewer</h3>
      <button id="vrmModalClose" onclick="closeVrmModal()">&times;</button>
    </div>
    <div id="vrmCanvasContainer">
      <canvas id="vrmCanvas"></canvas>
      <div id="vrmLoading">Loading VRM…</div>
      <div id="vrmError"></div>
    </div>
    <div id="vrmModalFooter">
      <span id="vrmFooterInfo"></span>
      <a id="vrmFooterLink" href="#" target="_blank">Open VRM file ↗</a>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
