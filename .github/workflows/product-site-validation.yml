name: Product Site Validation

on:
  push:
    branches:
      - product-site-foundation
    paths:
      - 'product-site/**'
      - '.github/workflows/product-site-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product-site/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
