name: Product Site Validation

on:
  push:
    branches:
      - product-site-foundation
    paths:
      - 'product-site/**'
      - '.github/workflows/product-site-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: product-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product-site/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-site-typecheck
          path: product-site/typecheck.log
          retention-days: 1

      - name: Production build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > next-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat next-server.log
          exit 1

      - name: Route smoke test
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            '/'
            '/explore/avatar-sets'
            '/explore/avatar-sets/core-entity-lab'
            '/explore/avatar-sets/core-entity-lab/avatars/robot-anchor'
          )
          : > route-smoke.log
          for route in "${routes[@]}"; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000${route}")"
            printf '%s %s\n' "$status" "$route" | tee -a route-smoke.log
            test "$status" = '200'
          done

      - name: Install screenshot browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture desktop and mobile routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          routes=(
            'home|/'
            'sets|/explore/avatar-sets'
            'set-detail|/explore/avatar-sets/core-entity-lab'
            'avatar-detail|/explore/avatar-sets/core-entity-lab/avatars/robot-anchor'
          )
          for entry in "${routes[@]}"; do
            name="${entry%%|*}"
            route="${entry#*|}"
            npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='1440,1100' "http://127.0.0.1:3000${route}" "qa/${name}-desktop.png"
            npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='390,844' "http://127.0.0.1:3000${route}" "qa/${name}-mobile.png"
          done

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-site-visual-qa
          path: |
            product-site/qa/*.png
            product-site/route-smoke.log
            product-site/next-server.log
          if-no-files-found: warn
          retention-days: 1
