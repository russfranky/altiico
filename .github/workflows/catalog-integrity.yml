name: Catalog integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild one atomic artifact snapshot
        run: |
          python scripts/export_hubzz_manifest.py --validate
          python scripts/export_avatars_registry.py
          python scripts/export_hubzz_staging.py --validate
          python scripts/build_catalog.py
      - name: Verify database, artifacts, and secrets
        run: |
          sqlite3 data/vrm_index.db 'PRAGMA foreign_keys=ON; PRAGMA integrity_check; PRAGMA foreign_key_check;'
          python scripts/verify_catalog_consistency.py
          git diff --exit-code
      - name: Run repository tests
        run: |
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
      - name: Package QA snapshot
        if: always()
        run: tar --exclude=.git -czf /tmp/altiico-qa-snapshot.tar.gz .
      - name: Upload QA snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altiico-qa-snapshot
          path: /tmp/altiico-qa-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
