name: Inspect VRM validation errors

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print unresolved tasks from the latest staging validation run
        run: |
          sqlite3 -header -column data/vrm_index.db <<'SQL'
          WITH target AS (
              SELECT id
              FROM crawl_runs
              WHERE json_extract(config_json, '$.command') = 'run_staging_validation_pass.py'
              ORDER BY id DESC
              LIMIT 1
          )
          SELECT
              t.id,
              t.canonical_key,
              t.state,
              t.attempts,
              t.last_error,
              group_concat(DISTINCT NULLIF(b.collection_id, '')) AS collections,
              group_concat(DISTINCT NULLIF(b.avatar_id, '')) AS avatars
          FROM crawl_tasks t
          LEFT JOIN crawl_bindings b ON b.task_id=t.id
          WHERE t.run_id=(SELECT id FROM target)
            AND t.state != 'done'
          GROUP BY t.id
          ORDER BY t.state, t.canonical_key;
          SQL
