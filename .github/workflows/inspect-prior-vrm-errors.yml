name: Inspect prior VRM validation errors

on:
  push:
    branches:
      - agent/vrm-link-audit
    paths:
      - .github/workflows/inspect-prior-vrm-errors.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/binary-validate-staging-inventory

      - name: Print failed asset tasks from the latest validation run
        run: |
          sqlite3 -header -column data/vrm_index.db <<'SQL'
          SELECT id, started_at, finished_at, status, requests_used, root_seed_count
          FROM crawl_runs
          ORDER BY id DESC
          LIMIT 5;

          WITH target AS (
              SELECT id
              FROM crawl_runs
              WHERE json_extract(config_json, '$.purpose') = 'staging_binary_validation'
              ORDER BY id DESC
              LIMIT 1
          )
          SELECT
              t.id,
              t.canonical_key,
              t.state,
              t.attempts,
              t.last_error,
              group_concat(NULLIF(b.collection_id, ''), ',') AS collections,
              group_concat(NULLIF(b.avatar_id, ''), ',') AS avatars
          FROM crawl_tasks t
          LEFT JOIN crawl_bindings b ON b.task_id=t.id
          WHERE t.run_id=(SELECT id FROM target)
            AND t.state != 'done'
          GROUP BY t.id
          ORDER BY t.state, t.canonical_key;
          SQL
