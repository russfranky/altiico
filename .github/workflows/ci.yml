name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify repository invariants
        run: python scripts/verify_repository.py

      - name: Compile Python
        run: python -m compileall -q scripts sy

      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/discovery-overlay.js
          node --check static/sw.js

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run deterministic core tests
        run: |
          python -m pytest -q -p no:recording \
            tests/test_catalog_snapshot.py \
            tests/test_chain_registry.py \
            tests/test_catalog_acceptance.py
