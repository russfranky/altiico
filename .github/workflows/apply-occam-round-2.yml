name: Apply Occam UX round 2

on:
  push:
    branches:
      - agent/occam-catalog-ux-round-2
    paths:
      - .github/workflows/apply-occam-round-2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Write reduced catalog surface
        env:
          INDEX_GZ_B64: 
          CSS_GZ_B64: 
          APP_GZ_B64: 
          TEST_GZ_B64: 
        run: |
          python - <<'PYCODE'
          import base64
          import gzip
          import os
          from pathlib import Path

          files = {
              "INDEX_GZ_B64": "static/index.html",
              "CSS_GZ_B64": "static/app.css",
              "APP_GZ_B64": "static/app.js",
              "TEST_GZ_B64": "tests/catalog-ux.mjs",
          }
          for variable, path in files.items():
              payload = base64.b64decode(os.environ[variable])
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(payload))
          PYCODE

      - name: Verify static catalog
        run: |
          node --check static/app.js
          node tests/catalog-ux.mjs
          node tests/catalog-performance.mjs

      - name: Commit verified files
        run: |
          rm .github/workflows/apply-occam-round-2.yml
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add static/index.html static/app.css static/app.js tests/catalog-ux.mjs .github/workflows/apply-occam-round-2.yml
          git commit -m "Tighten catalog scanning and viewer focus" -m "Collapse secondary filters, prioritize validated files, remove the redundant image modal, and pause the 3D render loop while closed.\n\nCo-Authored-By: ChatGPT <noreply@openai.com>"
          git push origin HEAD:${{ github.ref_name }}
