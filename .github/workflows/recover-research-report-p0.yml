name: Recover research report P0 integrity upgrade

on:
  push:
    branches:
      - agent/research-report-p0-integrity
    paths:
      - .github/workflows/recover-research-report-p0.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore the reviewed source transformation
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.github/patches').glob('research-report-p0.part*'))
          if len(parts) != 6:
              raise SystemExit(f'expected 6 patch chunks, found {len(parts)}')
          payload = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          if len(payload) != 20476:
              raise SystemExit(f'patch payload length mismatch: {len(payload)}')
          if hashlib.sha256(payload.encode()).hexdigest() != '84dbfd61ba8d2b4db56952244a7d82a44a8d1c8e066de4fedada9e4a6e407d7b':
              raise SystemExit('patch payload checksum mismatch')
          decoded = gzip.decompress(base64.b64decode(payload))
          if hashlib.sha256(decoded).hexdigest() != '8c8c784d6284af5c543621d988972f06d5a6ac11176fec715762eae32d155125':
              raise SystemExit('restored source checksum mismatch')
          target = Path('scripts/_apply_research_report_p0.py')
          target.write_bytes(decoded)
          print(f'restored {target} ({len(decoded)} bytes)')
          PY

      - name: Apply the integrity changes
        run: python scripts/_apply_research_report_p0.py

      - name: Stabilize the async test helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_shared_storefront.py')
          text = path.read_text(encoding='utf-8')
          old = '    return asyncio.get_event_loop().run_until_complete(coro)'
          new = '    return asyncio.run(coro)'
          if old not in text:
              raise SystemExit('shared-storefront helper shape changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Reconcile the validated Chuddies identity
        run: |
          cat >> migrations/023_artifact_snapshots.sql <<'SQL'

          -- Reconcile the validated Chuddies deployment. The token-127 crawl
          -- established 0x6b67... as the canonical VRM-bearing contract.
          UPDATE collections
          SET contract = '0x6b67b34dfded7cf3b32cab94045aa82da2cc4bd9'
          WHERE id = 'chuddie';

          UPDATE contracts
          SET is_primary = CASE
              WHEN lower(address) = '0x6b67b34dfded7cf3b32cab94045aa82da2cc4bd9' THEN 1
              ELSE 0
          END
          WHERE collection_id = 'chuddie';

          UPDATE collection_identifiers
          SET value = '0x6b67b34dfded7cf3b32cab94045aa82da2cc4bd9',
              contract = '0x6b67b34dfded7cf3b32cab94045aa82da2cc4bd9'
          WHERE collection_id = 'chuddie' AND namespace = 'contract_token';

          UPDATE collection_identifiers
          SET contract = '0x6b67b34dfded7cf3b32cab94045aa82da2cc4bd9'
          WHERE collection_id = 'chuddie' AND namespace = 'opensea_slug';
          SQL

      - name: Apply the snapshot migration
        run: sqlite3 data/vrm_index.db < migrations/023_artifact_snapshots.sql

      - name: Regenerate one coherent artifact snapshot
        run: |
          python scripts/build_catalog.py
          python scripts/export_hubzz_manifest.py --validate
          python scripts/export_avatars_registry.py
          python scripts/export_hubzz_staging.py --validate

      - name: Verify consistency and repository checks
        run: |
          python scripts/verify_catalog_consistency.py
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
          sqlite3 data/vrm_index.db 'PRAGMA integrity_check;'
          test -z "$(sqlite3 data/vrm_index.db 'PRAGMA foreign_key_check;')"

      - name: Commit the verified non-workflow tree
        run: |
          rm -f scripts/_apply_research_report_p0.py
          rm -f .github/workflows/apply-research-report-p0.yml
          rm -f .github/workflows/recover-research-report-p0.yml
          rm -f .github/workflows/inspect-chuddie-identity.yml
          rm -f .github/workflows/catalog-integrity.yml
          rm -rf .github/patches
          git checkout HEAD -- .github/workflows/live-vrm-discovery.yml
          git checkout HEAD -- .github/workflows/hubzz-prealpha-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes were produced.'
            exit 0
          fi
          git commit -m 'Enforce atomic catalog evidence snapshots [skip ci]'
          git push
