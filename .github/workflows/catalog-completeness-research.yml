name: Catalog completeness research

on:
  workflow_dispatch:
  push:
    branches: [agent/catalog-completeness-contract]
    paths:
      - scripts/audit_catalog_completeness.py
      - scripts/enforce_catalog_acceptance.py
      - scripts/build_catalog_research_queue.py
      - scripts/materialize_catalog_research.py
      - scripts/materialize_short_descriptions.py
      - scripts/materialize_public_vrm_access.py
      - scripts/export_vrm_inventory.py
      - scripts/export_avatars_registry.py
      - scripts/reconcile_markdown_catalog_sources.py
      - scripts/moralis_client.py
      - scripts/enumerate_moralis_vrm_inventory.py
      - scripts/probe_vrm_inventory.py
      - tests/test_catalog_completeness.py
      - tests/test_catalog_acceptance.py
      - tests/test_catalog_research_queue.py
      - tests/test_catalog_research_pipeline.py
      - tests/test_export_avatars_registry_access.py
      - tests/test_materialize_short_descriptions.py
      - tests/test_materialize_public_vrm_access.py
      - tests/test_moralis_full_inventory.py
      - tests/test_probe_vrm_inventory.py
      - data/catalog_research.json
      - data/vrm_collections.md
      - .github/workflows/catalog-completeness-research.yml

permissions:
  contents: write

env:
  OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
  MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
  MORALIS_KEY: ${{ secrets.MORALIS_KEY }}
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
  ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
  BITQUERY_API_KEY: ${{ secrets.BITQUERY_API_KEY }}
  BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
  BITQUERY_OAUTH_TOKEN: ${{ secrets.BITQUERY_OAUTH_TOKEN }}

concurrency:
  group: catalog-completeness-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Require real source credentials
        run: |
          test -n "$OPENSEA_API_KEY"
          test -n "$MORALIS_API_KEY" || test -n "$MORALIS_KEY"
          test -n "$ETHERSCAN_API_KEY" || test -n "$ETHERSCAN_KEY"
          test -n "$BITQUERY_API_KEY" || test -n "$BITQUERY_TOKEN" || test -n "$BITQUERY_OAUTH_TOKEN"

      - name: Verify completeness and research pipeline
        run: |
          python -m py_compile \
            scripts/audit_catalog_completeness.py \
            scripts/enforce_catalog_acceptance.py \
            scripts/build_catalog_research_queue.py \
            scripts/materialize_catalog_research.py \
            scripts/materialize_short_descriptions.py \
            scripts/materialize_public_vrm_access.py \
            scripts/export_vrm_inventory.py \
            scripts/export_avatars_registry.py \
            scripts/reconcile_markdown_catalog_sources.py \
            scripts/moralis_client.py \
            scripts/enumerate_moralis_vrm_inventory.py \
            scripts/probe_vrm_inventory.py
          python -m pytest \
            tests/test_catalog_completeness.py \
            tests/test_catalog_acceptance.py \
            tests/test_catalog_research_queue.py \
            tests/test_catalog_research_pipeline.py \
            tests/test_export_avatars_registry_access.py \
            tests/test_materialize_short_descriptions.py \
            tests/test_materialize_public_vrm_access.py \
            tests/test_moralis_full_inventory.py \
            tests/test_probe_vrm_inventory.py -q

      - name: Seed researched identities before API enrichment
        run: |
          python scripts/materialize_catalog_research.py
          python scripts/reconcile_markdown_catalog_sources.py \
            --output data/markdown_source_reconciliation.json

      - name: Refresh OpenSea identity, media and socials with real key
        run: |
          python scripts/enrich_opensea.py --meta-only --force
          python scripts/materialize_short_descriptions.py

      - name: Refresh sampled Moralis source evidence with real key
        run: |
          mkdir -p /tmp/vrm-source-refresh
          python scripts/cross_reference_sources.py \
            --output /tmp/vrm-source-refresh/moralis.json \
            --concurrency 3 --collection-concurrency 3
          python scripts/discover_moralis_models.py \
            --output /tmp/vrm-source-refresh/moralis-models.json \
            --tokens 25 --concurrency 3 --collection-concurrency 3
          python - <<'PY'
          import json, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          cross=json.loads(Path('/tmp/vrm-source-refresh/moralis.json').read_text())
          models=json.loads(Path('/tmp/vrm-source-refresh/moralis-models.json').read_text())

          def healthy(data):
              summary=(data or {}).get('summary',{})
              inspected=summary.get('collectionsInspected', summary.get('collections',0))
              errors=summary.get('collectionsWithErrors',0)
              return bool(inspected) and errors < inspected

          def restore_last_good(path):
              target=Path(path)
              if target.exists():
                  try:
                      if healthy(json.loads(target.read_text())):
                          return 'current-committed'
                  except Exception:
                      pass
              try:
                  payload=subprocess.check_output(['git','show',f'origin/main:{path}'])
                  candidate=json.loads(payload)
                  if healthy(candidate):
                      target.write_bytes(payload)
                      return 'origin-main-last-good'
              except Exception:
                  pass
              return 'unavailable'

          cross_ok=healthy(cross)
          models_ok=healthy(models)
          if cross_ok:
              shutil.copyfile('/tmp/vrm-source-refresh/moralis.json','data/source_cross_reference_report.json')
              cross_mode='fresh'
          else:
              cross_mode=restore_last_good('data/source_cross_reference_report.json')

          if models_ok:
              shutil.copyfile('/tmp/vrm-source-refresh/moralis-models.json','data/moralis_model_discovery.json')
              model_mode='fresh'
          else:
              model_mode=restore_last_good('data/moralis_model_discovery.json')

          if cross_mode == 'unavailable':
              raise SystemExit('Moralis refresh failed and no healthy last-good cross-reference exists')
          if model_mode == 'unavailable':
              raise SystemExit('Moralis model discovery failed and no healthy last-good snapshot exists')

          health={
            'generatedAt':datetime.now(timezone.utc).isoformat(),
            'moralis':{
              'freshCrossReference':cross_ok,
              'freshModelDiscovery':models_ok,
              'crossReferenceMode':cross_mode,
              'modelDiscoveryMode':model_mode,
              'attemptSummary':cross.get('summary',{}),
              'modelAttemptSummary':models.get('summary',{}),
            },
          }
          Path('data/source_health.json').write_text(json.dumps(health,indent=2)+'\n')
          print(json.dumps(health,indent=2))
          PY
          python scripts/build_source_consensus.py

      - name: Exhaust every Moralis collection cursor for all VRM links
        run: |
          python scripts/enumerate_moralis_vrm_inventory.py \
            --output data/moralis_full_vrm_inventory.json \
            --tiers A,B,C \
            --page-size 100 \
            --max-pages 0 \
            --max-tokens 0 \
            --concurrency 3 \
            --collection-concurrency 2

      - name: Refresh Etherscan authority with real key and preserve last-good evidence
        run: |
          mkdir -p /tmp/vrm-source-refresh
          python scripts/audit_etherscan_authority.py \
            --output /tmp/vrm-source-refresh/etherscan.json \
            --concurrency 3 --collection-concurrency 3
          python scripts/preserve_etherscan_evidence.py \
            --fresh /tmp/vrm-source-refresh/etherscan.json \
            --previous data/etherscan_authority_report.json \
            --output data/etherscan_authority_report.json \
            --health data/source_health.json

      - name: Refresh Bitquery on-chain evidence with real key
        run: |
          python scripts/audit_bitquery_evidence.py \
            --output data/bitquery_evidence_report.json \
            --tokens 25 --concurrency 3 --collection-concurrency 3
          python scripts/build_authoritative_consensus.py

      - name: Merge, probe and materialize VRM inventory facts
        run: |
          python scripts/materialize_catalog_research.py
          python scripts/materialize_short_descriptions.py
          python scripts/export_vrm_inventory.py \
            --moralis-inventory data/moralis_full_vrm_inventory.json \
            --output static/data/vrm-inventory.json
          python scripts/probe_vrm_inventory.py \
            --source static/data/vrm-inventory.json \
            --output data/vrm_inventory_probe.json \
            --workers 4 \
            --timeout 20
          python scripts/materialize_public_vrm_access.py \
            --inventory static/data/vrm-inventory.json \
            --probe data/vrm_inventory_probe.json
          python scripts/export_vrm_inventory.py \
            --moralis-inventory data/moralis_full_vrm_inventory.json \
            --output static/data/vrm-inventory.json

      - name: Measure every literal collection requirement
        run: |
          python scripts/audit_catalog_completeness.py \
            --tiers A,B,C,ARWEAVE \
            --output data/catalog_completeness_report.json
          python scripts/enforce_catalog_acceptance.py \
            --report data/catalog_completeness_report.json \
            --inventory static/data/vrm-inventory.json \
            --probe data/vrm_inventory_probe.json \
            --output data/catalog_acceptance.json || true
          python scripts/build_catalog_research_queue.py \
            --acceptance data/catalog_acceptance.json \
            --output data/catalog_research_queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/catalog_completeness_report.json').read_text())
          acceptance=json.loads(Path('data/catalog_acceptance.json').read_text())
          queue=json.loads(Path('data/catalog_research_queue.json').read_text())
          print(json.dumps(report['summary'],indent=2))
          print(json.dumps({
            'literalAcceptance': {
              'collections':acceptance['collections'],
              'passing':acceptance['passing'],
              'failing':acceptance['failing'],
              'reasonCounts':acceptance['reasonCounts'],
            },
            'researchQueue':queue['summary'],
          },indent=2))
          print(json.dumps({'firstFailures':acceptance['failures'][:25]},indent=2))
          PY

      - name: Rebuild one coherent public snapshot
        run: |
          python scripts/export_hubzz_manifest.py --validate
          python scripts/export_avatars_registry.py
          python scripts/export_hubzz_staging.py --validate
          python scripts/build_catalog.py

      - name: Verify repository after source refresh
        run: |
          python scripts/verify_catalog_consistency.py
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
          sqlite3 data/vrm_index.db 'PRAGMA foreign_keys=ON; PRAGMA integrity_check; PRAGMA foreign_key_check;'

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-completeness-evidence
          path: |
            data/catalog_completeness_report.json
            data/catalog_acceptance.json
            data/catalog_research_queue.json
            data/markdown_source_reconciliation.json
            data/source_cross_reference_report.json
            data/source_consensus.json
            data/moralis_model_discovery.json
            data/moralis_full_vrm_inventory.json
            data/vrm_inventory_probe.json
            data/source_health.json
            data/etherscan_authority_report.json
            data/bitquery_evidence_report.json
            data/authoritative_consensus.json
            static/data/vrm-inventory.json
          retention-days: 30

      - name: Commit refreshed evidence and public catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/vrm_index.db \
            data/catalog_completeness_report.json \
            data/catalog_acceptance.json \
            data/catalog_research_queue.json \
            data/markdown_source_reconciliation.json \
            data/source_cross_reference_report.json \
            data/source_consensus.json \
            data/moralis_model_discovery.json \
            data/moralis_full_vrm_inventory.json \
            data/vrm_inventory_probe.json \
            data/source_health.json \
            data/etherscan_authority_report.json \
            data/bitquery_evidence_report.json \
            data/authoritative_consensus.json \
            static/data static/sw.js docs/hubzz-prealpha-staging.md
          if git diff --cached --quiet; then
            echo 'Catalog completeness evidence already current.'
          else
            git commit -m 'Refresh catalog completeness evidence [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Hard acceptance gate — every literal requirement must pass
        run: |
          python scripts/enforce_catalog_acceptance.py \
            --report data/catalog_completeness_report.json \
            --inventory static/data/vrm-inventory.json \
            --probe data/vrm_inventory_probe.json \
            --output data/catalog_acceptance.json
