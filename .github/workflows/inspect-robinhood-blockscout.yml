name: Inspect Robinhood Blockscout filters
on:
  push:
    branches: [agent/opensea-high-recall-discovery]
    paths: [.github/workflows/inspect-robinhood-blockscout.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe token list filters
        run: |
          python - <<'PY'
          import urllib.error, urllib.request
          base='https://robinhoodchain.blockscout.com/api/v2/tokens'
          for suffix in ('', '?type=ERC-721', '?type=ERC-1155', '?type=ERC-721%2CERC-1155'):
              url=base+suffix
              req=urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'vrm-catalog/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body=r.read(800).decode('utf-8','replace')
                      print(url, r.status, body[:800])
              except urllib.error.HTTPError as e:
                  print(url, e.code, e.read(800).decode('utf-8','replace'))
          PY
