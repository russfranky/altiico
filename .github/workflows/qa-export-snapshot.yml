name: QA export snapshot

on:
  push:
    branches:
      - qa/recursive-quality-loop-2026-08-18
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository snapshot
        run: tar --exclude=.git -czf /tmp/altiico-qa-snapshot.tar.gz .
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: altiico-qa-snapshot
          path: /tmp/altiico-qa-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
