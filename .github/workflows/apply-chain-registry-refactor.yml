name: Apply shared chain registry refactor

on:
  push:
    branches: [agent/opensea-high-recall-discovery]
    paths: [.github/workflows/apply-chain-registry-refactor.yml]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opensea-high-recall-discovery
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Replace duplicated chain maps
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          fetch_path = 'scripts/crawler/fetch.py'
          fetch_block = '''EVM_RPCS: dict[str, tuple[str, ...]] = {
              "ethereum": ("https://ethereum-rpc.publicnode.com", "https://eth.llamarpc.com"),
              "base": ("https://base-rpc.publicnode.com", "https://mainnet.base.org"),
              "polygon": ("https://polygon-bor-rpc.publicnode.com", "https://polygon-rpc.com"),
              "optimism": ("https://optimism-rpc.publicnode.com", "https://mainnet.optimism.io"),
              "arbitrum": ("https://arbitrum-one-rpc.publicnode.com",),
              "shape": ("https://mainnet.shape.network",),
              "ape_chain": ("https://apechain.calderachain.xyz/http",),
          }
          '''.replace('          ', '')
          p = Path(fetch_path)
          text = p.read_text(encoding='utf-8')
          if 'from scripts.chain_registry import EVM_RPCS' not in text:
              marker = 'from scripts.crawler.models import (\n'
              if marker not in text:
                  raise SystemExit('crawler fetch import marker changed')
              text = text.replace(marker, 'from scripts.chain_registry import EVM_RPCS\nfrom scripts.crawler.models import (\n', 1)
          if fetch_block in text:
              text = text.replace(fetch_block, '', 1)
          elif 'EVM_RPCS: dict[str, tuple[str, ...]]' in text:
              raise SystemExit('crawler EVM_RPCS block changed')
          p.write_text(text, encoding='utf-8')

          old_rpc = '''RPCS: dict[str, list[str]] = {
              "ethereum": ["https://ethereum-rpc.publicnode.com", "https://eth.llamarpc.com"],
              "base": ["https://base-rpc.publicnode.com", "https://mainnet.base.org"],
              "polygon": ["https://polygon-bor-rpc.publicnode.com", "https://polygon-rpc.com"],
              "optimism": ["https://optimism-rpc.publicnode.com", "https://mainnet.optimism.io"],
              "arbitrum": ["https://arbitrum-one-rpc.publicnode.com"],
              "shape": ["https://mainnet.shape.network"],
              "ape_chain": ["https://apechain.calderachain.xyz/http"],
          }
          '''.replace('          ', '')
          p = Path('scripts/discover_vrm_urls.py')
          text = p.read_text(encoding='utf-8')
          if 'from scripts.chain_registry import EVM_RPCS as RPCS' not in text:
              marker = 'from scripts.discover_metadata_fields import scan_metadata  # noqa: E402\n'
              if marker not in text:
                  raise SystemExit('legacy resolver import marker changed')
              text = text.replace(marker, 'from scripts.chain_registry import EVM_RPCS as RPCS  # noqa: E402\n' + marker, 1)
          if old_rpc in text:
              text = text.replace(old_rpc, '', 1)
          elif 'RPCS: dict[str, list[str]]' in text:
              raise SystemExit('legacy RPCS block changed')
          p.write_text(text, encoding='utf-8')

          old_map = '''CHAIN_MAP: dict[str, str] = {
              "ethereum": "ethereum",
              "polygon": "matic",
              "base": "base",
              "optimism": "optimism",
              "shape": "shape",
              "arbitrum": "arbitrum",
              "sepolia": "sepolia",
          }
          '''.replace('          ', '')
          p = Path('scripts/opensea_client.py')
          text = p.read_text(encoding='utf-8')
          if 'from scripts.chain_registry import OPENSEA_CHAIN_MAP as CHAIN_MAP' not in text:
              marker = 'import aiohttp\n'
              if marker not in text:
                  raise SystemExit('OpenSea import marker changed')
              text = text.replace(marker, 'import aiohttp\n\nfrom scripts.chain_registry import OPENSEA_CHAIN_MAP as CHAIN_MAP\n', 1)
          if old_map in text:
              text = text.replace(old_map, '', 1)
          elif 'CHAIN_MAP: dict[str, str]' in text:
              raise SystemExit('OpenSea CHAIN_MAP block changed')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify recursive chain integration
        run: |
          python -m py_compile scripts/chain_registry.py scripts/crawler/fetch.py scripts/discover_vrm_urls.py scripts/run_live_discovery.py scripts/opensea_client.py
          python - <<'PY'
          from scripts.chain_registry import EVM_RPCS
          from scripts.crawler.fetch import EVM_RPCS as CRAWLER_RPCS
          from scripts.discover_vrm_urls import RPCS as LEGACY_RPCS
          assert EVM_RPCS == CRAWLER_RPCS
          assert EVM_RPCS == LEGACY_RPCS
          assert 'robinhood' in CRAWLER_RPCS
          print('shared registry chains:', ', '.join(sorted(EVM_RPCS)))
          PY
          python -m pytest tests/test_chain_registry.py tests/test_opensea_client.py tests/test_recursive_crawler.py -q

      - name: Commit refactor and remove helper
        run: |
          rm .github/workflows/apply-chain-registry-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/crawler/fetch.py scripts/discover_vrm_urls.py scripts/opensea_client.py tests/test_chain_registry.py .github/workflows/apply-chain-registry-refactor.yml
          git commit -m 'Unify recursive discovery chain configuration'
          git push
