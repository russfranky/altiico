name: 3dvault discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * 4'
  push:
    branches: [agent/3dvault-discovery, main]
    paths:
      - scripts/discover_3dvault.py
      - scripts/enrich_3dvault_context.py
      - scripts/discover_3dvault_backend.py
      - scripts/discover_3dvault_named_projects.py
      - scripts/promote_3dvault_consideration.py
      - scripts/sync_3dvault_leads.py
      - data/os_scrape/research_candidates.json
      - static/discovery-overlay.js
      - .github/workflows/3dvault-discovery.yml

permissions:
  contents: write

concurrency:
  group: 3dvault-discovery-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Require OpenSea credential
        run: test -n "$OPENSEA_API_KEY"
      - name: Compile crawler
        run: python -m py_compile scripts/discover_3dvault.py scripts/enrich_3dvault_context.py scripts/discover_3dvault_backend.py scripts/discover_3dvault_named_projects.py scripts/promote_3dvault_consideration.py scripts/sync_3dvault_leads.py scripts/sync_discovery_to_db.py scripts/materialize_discovery_fields.py
      - name: Crawl 3dvault relationship graph and underlying data sources
        run: |
          python scripts/discover_3dvault.py --output data/3dvault_discovery.json --max-follow 50
          python scripts/enrich_3dvault_context.py --report data/3dvault_discovery.json
          python scripts/discover_3dvault_backend.py --output data/3dvault_backend_probe.json
      - name: Deep inspect named 3dvault partner collections
        run: python scripts/discover_3dvault_named_projects.py --output data/3dvault_named_project_discovery.json --sample 40 --timeout 12 --collection-concurrency 2
      - name: Materialize named consideration inventory and evidence
        run: |
          python scripts/promote_3dvault_consideration.py
          python scripts/sync_3dvault_leads.py
          python scripts/sync_discovery_to_db.py
          python scripts/materialize_discovery_fields.py
      - name: Rebuild atomic public and Hubzz artifacts
        run: |
          python scripts/export_hubzz_manifest.py --validate
          python scripts/export_avatars_registry.py
          python scripts/export_hubzz_staging.py --validate
          python scripts/build_catalog.py
      - name: Assert public inventory actually increased
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          named=json.loads(Path('data/3dvault_named_project_discovery.json').read_text())
          info=json.loads(Path('static/data/build-info.json').read_text())
          public=json.loads((Path('static/data')/info['files']['collections']).read_text())['collections']
          conn=sqlite3.connect('data/vrm_index.db')
          total=conn.execute('SELECT COUNT(*) FROM collections').fetchone()[0]
          considered=conn.execute("SELECT COUNT(*) FROM collections WHERE avatar_delivery_status IS NOT NULL").fetchone()[0]
          holder=conn.execute("SELECT COUNT(*) FROM collections WHERE avatar_delivery_status='holder_vrm_confirmed'").fetchone()[0]
          voyagers=next((r for r in public if (r.get('contract') or '').lower()=='0x3137e02341a4acbf01a02cfb60ccc194c3452756'), None)
          summary={'collections':total,'publicCollections':len(public),'new3dConsiderations':considered,'holderVrmConfirmed':holder,'namedProjects':named['summary'],'voyagersPublic':bool(voyagers),'voyagersStatus':voyagers.get('avatar_delivery_status') if voyagers else None}
          print(json.dumps(summary,indent=2))
          assert total >= 69, f'expected catalog inventory to increase beyond 65, got {total}'
          assert len(public) == total
          assert considered >= 4
          assert holder >= 1
          assert voyagers and voyagers.get('avatar_delivery_status') == 'holder_vrm_confirmed'
          conn.close()
          PY
      - name: Full verification
        run: |
          python scripts/verify_catalog_consistency.py
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
          node --check static/discovery-overlay.js
          sqlite3 data/vrm_index.db 'PRAGMA foreign_keys=ON; PRAGMA integrity_check; PRAGMA foreign_key_check;'
      - name: Commit discovery evidence and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/3dvault_discovery.json data/3dvault_backend_probe.json data/3dvault_named_project_discovery.json data/vrm_index.db static/data static/sw.js docs/hubzz-prealpha-staging.md
          if git diff --cached --quiet; then
            echo '3dvault discovery already current.'
            exit 0
          fi
          git commit -m 'Materialize named 3dvault avatar considerations [skip ci]'
          git push
