name: 3dvault discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * 4'
  push:
    branches: [agent/3dvault-discovery, main]
    paths:
      - scripts/discover_3dvault.py
      - scripts/sync_3dvault_leads.py
      - .github/workflows/3dvault-discovery.yml

permissions:
  contents: write

concurrency:
  group: 3dvault-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile crawler
        run: python -m py_compile scripts/discover_3dvault.py scripts/sync_3dvault_leads.py scripts/materialize_discovery_fields.py
      - name: Crawl 3dvault relationship graph
        run: python scripts/discover_3dvault.py --output data/3dvault_discovery.json --max-follow 50
      - name: Persist leads and reconcile known identity
        run: |
          python scripts/sync_3dvault_leads.py
          python scripts/materialize_discovery_fields.py
      - name: Rebuild atomic public and Hubzz artifacts
        run: |
          python scripts/export_hubzz_manifest.py --validate
          python scripts/export_avatars_registry.py
          python scripts/export_hubzz_staging.py --validate
          python scripts/build_catalog.py
      - name: Assert source produced durable leads
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          report=json.loads(Path('data/3dvault_discovery.json').read_text())
          conn=sqlite3.connect('data/vrm_index.db')
          leads=conn.execute("SELECT COUNT(*) FROM discovery_leads WHERE source='3dvault'").fetchone()[0]
          matched=conn.execute("SELECT COUNT(*) FROM discovery_leads WHERE source='3dvault' AND collection_id IS NOT NULL").fetchone()[0]
          evidence=conn.execute("SELECT COUNT(*) FROM discovery_evidence WHERE source='3dvault'").fetchone()[0]
          summary={'report':report['summary'],'storedLeads':leads,'matchedCollections':matched,'evidenceRows':evidence}
          print(json.dumps(summary,indent=2))
          assert report['summary']['avatarCollectionLeads'] > 0
          assert leads > 0
          conn.close()
          PY
      - name: Full verification
        run: |
          python scripts/verify_catalog_consistency.py
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
          sqlite3 data/vrm_index.db 'PRAGMA foreign_keys=ON; PRAGMA integrity_check; PRAGMA foreign_key_check;'
      - name: Commit discovery evidence and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/3dvault_discovery.json data/vrm_index.db static/data static/sw.js docs/hubzz-prealpha-staging.md
          if git diff --cached --quiet; then
            echo '3dvault discovery already current.'
            exit 0
          fi
          git commit -m 'Refresh 3dvault discovery evidence [skip ci]'
          git push
