name: Inspect Chuddies identity evidence

on:
  push:
    branches:
      - agent/research-report-p0-integrity
    paths:
      - .github/workflows/inspect-chuddie-identity.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Show canonical and evidence rows
        run: |
          sqlite3 -header -column data/vrm_index.db <<'SQL'
          SELECT id,name,chain,contract,opensea_slug,vrm_url_https,vrm_check_status
          FROM collections WHERE id='chuddie';
          SELECT rowid,collection_id,address,chain,token_standard,is_primary
          FROM contracts WHERE collection_id='chuddie' ORDER BY rowid;
          SELECT rowid,collection_id,namespace,value,contract
          FROM collection_identifiers WHERE collection_id='chuddie' ORDER BY rowid;
          SELECT id,run_id,subject_type,subject_key,predicate,value_json,source_url,json_path,confidence,observed_at
          FROM crawl_observations
          WHERE subject_key LIKE '%chudd%'
             OR value_json LIKE '%6b67b34d%'
             OR value_json LIKE '%e8979fdd%'
          ORDER BY id;
          SELECT id,run_id,collection_id,field_name,old_value_json,new_value_json,evidence_observation_id,applied_at
          FROM crawl_materializations
          WHERE collection_id='chuddie'
          ORDER BY id;
          SQL
