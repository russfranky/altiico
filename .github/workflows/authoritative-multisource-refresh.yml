name: Authoritative multi-source refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 3'
  push:
    branches: [main, agent/bitquery-evidence]
    paths:
      - scripts/opensea_client.py
      - scripts/moralis_client.py
      - scripts/etherscan_client.py
      - scripts/bitquery_client.py
      - scripts/cross_reference_sources.py
      - scripts/build_source_consensus.py
      - scripts/discover_moralis_models.py
      - scripts/audit_etherscan_authority.py
      - scripts/audit_bitquery_evidence.py
      - scripts/build_authoritative_consensus.py
      - scripts/export_hubzz_staging.py
      - .github/workflows/authoritative-multisource-refresh.yml

permissions:
  contents: write

concurrency:
  group: authoritative-multisource-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
  MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
  MORALIS_KEY: ${{ secrets.MORALIS_KEY }}
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
  ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
  BITQUERY_API_KEY: ${{ secrets.BITQUERY_API_KEY }}
  BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
  BITQUERY_OAUTH_TOKEN: ${{ secrets.BITQUERY_OAUTH_TOKEN }}

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Require source credentials
        run: |
          test -n "$OPENSEA_API_KEY"
          test -n "$MORALIS_API_KEY" || test -n "$MORALIS_KEY"
          test -n "$ETHERSCAN_API_KEY" || test -n "$ETHERSCAN_KEY"
          test -n "$BITQUERY_API_KEY" || test -n "$BITQUERY_TOKEN" || test -n "$BITQUERY_OAUTH_TOKEN"
      - name: Compile evidence pipeline
        run: |
          python -m py_compile scripts/opensea_client.py scripts/moralis_client.py scripts/etherscan_client.py scripts/bitquery_client.py \
            scripts/cross_reference_sources.py scripts/build_source_consensus.py scripts/discover_moralis_models.py \
            scripts/audit_etherscan_authority.py scripts/audit_bitquery_evidence.py scripts/build_authoritative_consensus.py scripts/export_hubzz_staging.py
      - name: Refresh OpenSea collection media
        run: python scripts/enrich_opensea.py --meta-only --force
      - name: Refresh Moralis without destroying last-good evidence
        run: |
          mkdir -p /tmp/vrm-source-refresh
          python scripts/cross_reference_sources.py --output /tmp/vrm-source-refresh/moralis.json --concurrency 3 --collection-concurrency 3
          python scripts/discover_moralis_models.py --output /tmp/vrm-source-refresh/moralis-models.json --tokens 25 --concurrency 3 --collection-concurrency 3
          python - <<'PY'
          import json, subprocess, shutil
          from datetime import datetime, timezone
          from pathlib import Path

          cross=json.loads(Path('/tmp/vrm-source-refresh/moralis.json').read_text())
          models=json.loads(Path('/tmp/vrm-source-refresh/moralis-models.json').read_text())
          cs=cross.get('summary',{})
          ms=models.get('summary',{})

          def healthy(data):
              summary=(data or {}).get('summary',{})
              inspected=summary.get('collectionsInspected', summary.get('collections',0))
              errors=summary.get('collectionsWithErrors',0)
              return bool(inspected) and errors < inspected

          def restore_last_good(path: str):
              target=Path(path)
              if target.exists():
                  try:
                      if healthy(json.loads(target.read_text())):
                          return 'current-committed'
                  except Exception:
                      pass
              try:
                  payload=subprocess.check_output(['git','show',f'origin/main:{path}'])
                  candidate=json.loads(payload)
                  if healthy(candidate):
                      target.write_bytes(payload)
                      return 'origin-main-last-good'
              except Exception:
                  pass
              return 'unavailable'

          cross_ok=healthy(cross)
          models_ok=healthy(models)
          if cross_ok:
              shutil.copyfile('/tmp/vrm-source-refresh/moralis.json','data/source_cross_reference_report.json')
              cross_mode='fresh'
          else:
              cross_mode=restore_last_good('data/source_cross_reference_report.json')

          if models_ok:
              shutil.copyfile('/tmp/vrm-source-refresh/moralis-models.json','data/moralis_model_discovery.json')
              model_mode='fresh'
          else:
              model_mode=restore_last_good('data/moralis_model_discovery.json')
              if model_mode == 'unavailable':
                  placeholder={
                    'schema':'moralis-model-discovery-v1',
                    'generatedAt':datetime.now(timezone.utc).isoformat(),
                    'availability':'unavailable',
                    'reason':'latest Moralis attempt failed and no healthy committed model-discovery snapshot exists',
                    'policy':'lead-only; no model candidates are asserted while source evidence is unavailable',
                    'summary':{
                      'collectionsInspected':0,
                      'collectionsWithErrors':0,
                      'nftsWithSignals':0,
                      'modelCandidates':0,
                      'unsupportedMediaNfts':0,
                    },
                    'collections':[],
                  }
                  Path('data/moralis_model_discovery.json').write_text(json.dumps(placeholder,indent=2)+'\n')

          if cross_mode == 'unavailable':
              raise SystemExit('Moralis refresh failed and no healthy last-good cross-reference exists')

          health={
            'generatedAt': datetime.now(timezone.utc).isoformat(),
            'moralis': {
              'freshCrossReference': cross_ok,
              'freshModelDiscovery': models_ok,
              'crossReferenceMode': cross_mode,
              'modelDiscoveryMode': model_mode,
              'attemptSummary': cs,
              'modelAttemptSummary': ms,
            }
          }
          Path('data/source_health.json').write_text(json.dumps(health,indent=2)+'\n')
          print(json.dumps(health,indent=2))
          PY
          python scripts/build_source_consensus.py
      - name: Audit Etherscan contract authority
        run: python scripts/audit_etherscan_authority.py --output data/etherscan_authority_report.json --concurrency 3 --collection-concurrency 3
      - name: Audit Bitquery on-chain NFT evidence
        run: |
          python scripts/audit_bitquery_evidence.py --output data/bitquery_evidence_report.json --tokens 25 --concurrency 3 --collection-concurrency 3
          python scripts/build_authoritative_consensus.py
      - name: Regenerate Hubzz and catalog artifacts
        run: |
          python scripts/export_hubzz_manifest.py --validate
          python scripts/export_avatars_registry.py
          python scripts/export_hubzz_staging.py --validate
          python scripts/build_catalog.py
      - name: Assert banner and authority coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          staging=json.loads(Path('static/data/hubzz-prealpha-staging.json').read_text())
          authority=json.loads(Path('data/authoritative_consensus.json').read_text())
          models=json.loads(Path('data/moralis_model_discovery.json').read_text())
          bitquery=json.loads(Path('data/bitquery_evidence_report.json').read_text())
          health=json.loads(Path('data/source_health.json').read_text())
          sets=staging['sets']
          missing=[i['set']['slug'] for i in sets if not i['set'].get('bannerUrl')]
          dedicated=sum(i.get('bannerEvidence',{}).get('source')=='collection_banner' for i in sets)
          fallback=sum(i.get('bannerEvidence',{}).get('source')=='pfp_fallback' for i in sets)
          summary={'stageableSets':len(sets),'dedicatedBanners':dedicated,'pfpFallbacks':fallback,'missingBanners':missing,'authority':authority['summary'],'moralisModels':models['summary'],'moralisModelAvailability':models.get('availability','available'),'bitquery':bitquery['summary'],'sourceHealth':health}
          print(json.dumps(summary,indent=2))
          assert not missing
          assert dedicated+fallback==len(sets)
          assert authority['summary']['collections'] > 0
          assert bitquery['summary']['collectionsInspected'] > 0
          assert bitquery['summary']['collectionsObservedOnchain'] > 0, 'Bitquery produced no positive on-chain observations'
          PY
      - name: Full repository verification
        run: |
          python scripts/verify_catalog_consistency.py
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
          sqlite3 data/vrm_index.db 'PRAGMA foreign_keys=ON; PRAGMA integrity_check; PRAGMA foreign_key_check;'
      - uses: actions/upload-artifact@v4
        with:
          name: authoritative-multisource-evidence
          path: |
            data/source_cross_reference_report.json
            data/source_consensus.json
            data/moralis_model_discovery.json
            data/source_health.json
            data/etherscan_authority_report.json
            data/bitquery_evidence_report.json
            data/authoritative_consensus.json
      - name: Commit refreshed evidence and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_cross_reference_report.json data/source_consensus.json data/moralis_model_discovery.json data/source_health.json \
            data/etherscan_authority_report.json data/bitquery_evidence_report.json data/authoritative_consensus.json data/vrm_index.db \
            static/data static/sw.js docs/hubzz-prealpha-staging.md
          if git diff --cached --quiet; then
            echo 'Evidence and generated artifacts already current.'
            exit 0
          fi
          git commit -m 'Refresh authoritative multi-source catalog evidence [skip ci]'
          git push
