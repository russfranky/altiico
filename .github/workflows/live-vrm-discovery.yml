name: Live VRM discovery

on:
  push:
    branches:
      - agent/live-vrm-discovery
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-vrm-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run live contract-driven discovery
        run: |
          python scripts/run_live_discovery.py \
            --db data/vrm_index.db \
            --targets data/live_discovery_targets.yaml \
            --report data/live_discovery_report.json \
            --markdown-report docs/live-discovery-latest.md \
            --build

      - name: Verify crawler and catalog
        run: |
          python -m pytest tests/test_recursive_crawler.py -q
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          sqlite3 data/vrm_index.db 'PRAGMA integrity_check;'

      - name: Commit measured results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vrm_index.db data/live_discovery_report.json \
            docs/live-discovery-latest.md static/data static/sw.js
          if git diff --cached --quiet; then
            echo 'No persisted discovery changes.'
            exit 0
          fi
          git commit -m 'Run live recursive VRM discovery [skip ci]'
          git push
