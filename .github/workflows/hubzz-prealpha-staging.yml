name: Hubzz pre-alpha staging bundle

on:
  push:
    branches:
      - agent/hubzz-prealpha-staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hubzz-prealpha-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Reconcile set-level and per-avatar binary proof
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/export_hubzz_staging.py')
          text = path.read_text(encoding='utf-8')
          old = '        if not isinstance(source.get("binaryValidatedCount"), int) or source.get("binaryValidatedCount", 0) < 1:\n            errors.append(f"{prefix}: no binary-validated VRM proof")\n'
          new = '        binary_count = source.get("binaryValidatedCount")\n        has_sample_proof = isinstance(item.get("sampleEvidence"), dict)\n        if not isinstance(binary_count, int) or binary_count < 0:\n            errors.append(f"{prefix}: invalid binary validation count")\n        elif binary_count < 1 and not has_sample_proof:\n            errors.append(f"{prefix}: no binary-validated VRM proof")\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('staging validator shape changed; refusing an unsafe patch')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Export conservative Hubzz staging bundle
        run: |
          python scripts/export_hubzz_staging.py \
            --db data/vrm_index.db \
            --output static/data/hubzz-prealpha-staging.json \
            --report docs/hubzz-prealpha-staging.md \
            --validate

      - name: Verify staging and catalog
        run: |
          python -m pytest tests/test_hubzz_staging_export.py -q
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          sqlite3 data/vrm_index.db 'PRAGMA integrity_check;'

      - name: Commit generated staging artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/export_hubzz_staging.py \
            static/data/hubzz-prealpha-staging.json \
            static/data/hubzz-prealpha-source \
            docs/hubzz-prealpha-staging.md
          if git diff --cached --quiet; then
            echo 'Staging artifacts already current.'
            exit 0
          fi
          git commit -m 'Generate strict Hubzz pre-alpha staging bundle [skip ci]'
          git push
