name: Verify recursive discovery refactor

on:
  push:
    branches: [agent/opensea-high-recall-discovery]
    paths: [.github/workflows/verify-discovery-refactor.yml]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opensea-high-recall-discovery
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify catalog and discovery
        run: |
          python scripts/verify_catalog_consistency.py
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
          sqlite3 data/vrm_index.db 'PRAGMA foreign_keys=ON; PRAGMA integrity_check; PRAGMA foreign_key_check;'

      - name: Remove temporary verification workflow
        run: |
          rm .github/workflows/verify-discovery-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-discovery-refactor.yml
          git commit -m 'Remove temporary discovery verification workflow'
          git push
