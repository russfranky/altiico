name: DickButtVerse inventory probe

on:
  workflow_dispatch:
  push:
    branches: [agent/staging-sample-provenance]
    paths:
      - scripts/probe_dickbuttverse_inventory.py
      - scripts/census_dickbuttverse_inventory.py
      - tests/test_probe_dickbuttverse_inventory.py
      - tests/test_census_dickbuttverse_inventory.py
      - .github/workflows/dickbuttverse-inventory-probe.yml

permissions:
  contents: write

concurrency:
  group: dickbuttverse-inventory-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Verify probe and census logic
        run: |
          python -m py_compile scripts/probe_dickbuttverse_inventory.py scripts/census_dickbuttverse_inventory.py
          python -m pytest tests/test_probe_dickbuttverse_inventory.py tests/test_census_dickbuttverse_inventory.py tests/test_recursive_crawler.py -q

      - name: Probe supply range with fresh full-binary spot checks
        run: |
          python scripts/probe_dickbuttverse_inventory.py \
            --output data/dickbuttverse_inventory_probe.json \
            --sample-size 96 \
            --full-sample-size 24 \
            --workers 8 \
            --timeout 15

      - name: Census every numeric CDN asset ID structurally
        run: |
          python scripts/census_dickbuttverse_inventory.py \
            --output data/dickbuttverse_inventory_census.json \
            --workers 8 \
            --timeout 15

      - name: Assert non-promotional evidence scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          probe=json.loads(Path('data/dickbuttverse_inventory_probe.json').read_text())
          census=json.loads(Path('data/dickbuttverse_inventory_census.json').read_text())
          summary=probe['summary']
          cs=census['summary']
          known=set(probe['knownProvenIds'])
          full_ids={row['tokenId'] for row in probe['fullValidation']}
          print(json.dumps({'probe':summary,'census':cs},indent=2))
          assert probe['collection']['catalogId']=='dickbuttverse'
          assert probe['collection']['catalogSupply']==5363
          assert census['collection']['catalogId']=='dickbuttverse'
          assert census['collection']['catalogSupplyReference']==5363
          assert summary['knownBinaryProofsBeforeProbe'] >= 25
          assert summary['structuralSampleSize']==96
          assert summary['fullValidationSampleSize'] <= 24
          assert not (full_ids & known), 'full-validation subset should prefer out-of-sample IDs'
          assert cs['assetIdsCensused']==5363
          assert cs['structuralVrmAssets'] > 0
          assert cs['structuralVrmAssets'] + cs['missing404Assets'] + cs['otherErrorAssets'] == 5363
          PY

      - name: Repository verification
        run: |
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
          sqlite3 data/vrm_index.db 'PRAGMA foreign_keys=ON; PRAGMA integrity_check; PRAGMA foreign_key_check;'

      - uses: actions/upload-artifact@v4
        with:
          name: dickbuttverse-inventory-probe
          path: |
            data/dickbuttverse_inventory_probe.json
            data/dickbuttverse_inventory_census.json
          retention-days: 30

      - name: Commit measured inventory evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dickbuttverse_inventory_probe.json data/dickbuttverse_inventory_census.json
          if git diff --cached --quiet; then
            echo 'DickButtVerse inventory evidence already current.'
            exit 0
          fi
          git commit -m 'Census DickButtVerse VRM asset coverage [skip ci]'
          git push
