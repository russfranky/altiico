name: DickButtVerse inventory probe

on:
  workflow_dispatch:
  push:
    branches: [agent/staging-sample-provenance]
    paths:
      - scripts/probe_dickbuttverse_inventory.py
      - tests/test_probe_dickbuttverse_inventory.py
      - .github/workflows/dickbuttverse-inventory-probe.yml

permissions:
  contents: write

concurrency:
  group: dickbuttverse-inventory-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Verify probe selection logic
        run: |
          python -m py_compile scripts/probe_dickbuttverse_inventory.py
          python -m pytest tests/test_probe_dickbuttverse_inventory.py tests/test_recursive_crawler.py -q

      - name: Probe full supply range without materializing inventory
        run: |
          python scripts/probe_dickbuttverse_inventory.py \
            --output data/dickbuttverse_inventory_probe.json \
            --sample-size 96 \
            --full-sample-size 24 \
            --workers 8 \
            --timeout 15

      - name: Assert bounded non-promotional scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('data/dickbuttverse_inventory_probe.json').read_text())
          summary=report['summary']
          known=set(report['knownProvenIds'])
          full_ids={row['tokenId'] for row in report['fullValidation']}
          print(json.dumps(summary,indent=2))
          assert report['collection']['catalogId']=='dickbuttverse'
          assert report['collection']['catalogSupply']==5363
          assert summary['knownBinaryProofsBeforeProbe'] >= 25
          assert summary['structuralSampleSize']==96
          assert summary['fullValidationSampleSize'] <= 24
          assert not (full_ids & known), 'full-validation subset should prefer out-of-sample IDs'
          PY

      - name: Repository verification
        run: |
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs
          sqlite3 data/vrm_index.db 'PRAGMA foreign_keys=ON; PRAGMA integrity_check; PRAGMA foreign_key_check;'

      - uses: actions/upload-artifact@v4
        with:
          name: dickbuttverse-inventory-probe
          path: data/dickbuttverse_inventory_probe.json
          retention-days: 30

      - name: Commit measured probe evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dickbuttverse_inventory_probe.json
          if git diff --cached --quiet; then
            echo 'DickButtVerse inventory probe already current.'
            exit 0
          fi
          git commit -m 'Measure DickButtVerse VRM template coverage [skip ci]'
          git push
