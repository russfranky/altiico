name: Inspect targeted VRM repairs

on:
  push:
    branches:
      - agent/vrm-link-audit
    paths:
      - .github/workflows/inspect-vrm-repairs.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vrm-link-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Show current rows
        run: |
          sqlite3 -header -column data/vrm_index.db <<'SQL'
          SELECT id,name,contract,vrm_url_https,vrm_url_pattern,vrm_check_status,vrm_file_size
          FROM collections
          WHERE id IN ('boomboxheads-v2','phettaverse-editions');

          SELECT id,collection_id,model_file_url,check_status,reachable
          FROM avatars
          WHERE collection_id IN ('boomboxheads-v2','phettaverse-editions')
          ORDER BY collection_id,id;

          SELECT source_url,vrm_spec,parse_error,file_size,content_sha256,transport_url
          FROM vrm_metadata
          WHERE source_url LIKE '%QmURAuSRmFFAyragN3h6M6thhMhBPQmNgoNJApDSvob3D5%'
             OR source_url LIKE '%QmZYVVP2XMNK2mjcrac6zyocvAU9xuEupZ4zYuoPVuimr7%'
          ORDER BY source_url;
          SQL

      - name: Validate targeted alternatives
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict

          from scripts.crawler.fetch import NetworkLoader
          from scripts.crawler.models import CrawlPolicy

          policy = CrawlPolicy(timeout=25, max_attempts=2, max_vrm_bytes=64 * 1024 * 1024)
          loader = NetworkLoader(None, policy)
          targets = [
              'ipfs://QmURAuSRmFFAyragN3h6M6thhMhBPQmNgoNJApDSvob3D5/30.vrm',
              'ipfs://QmURAuSRmFFAyragN3h6M6thhMhBPQmNgoNJApDSvob3D5/386.vrm',
              'ipfs://QmZYVVP2XMNK2mjcrac6zyocvAU9xuEupZ4zYuoPVuimr7/borgormachinelowpoly.vrm',
          ]
          for target in targets:
              try:
                  result = loader.validate_vrm(target)
                  print(json.dumps({'target': target, 'result': asdict(result)}, ensure_ascii=False))
              except Exception as exc:
                  print(json.dumps({'target': target, 'error': f'{type(exc).__name__}: {exc}'}, ensure_ascii=False))
          PY
