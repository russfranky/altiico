name: OpenSea high-recall VRM discovery

on:
  push:
    branches:
      - agent/opensea-high-recall-discovery
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 3,6'

permissions:
  contents: write

concurrency:
  group: opensea-high-recall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify discovery code
        run: |
          python -m py_compile scripts/opensea_client.py \
            scripts/discover_opensea_candidates.py \
            scripts/discover_opensea_nfts.py \
            scripts/promote_opensea_validated.py
          python -m pytest tests/test_opensea_client.py tests/test_discover_opensea_nfts.py tests/test_promote_opensea_validated.py -q

      - name: Require OpenSea credential
        run: |
          if [ -z "$OPENSEA_API_KEY" ]; then
            echo 'OPENSEA_API_KEY is not configured in GitHub Actions secrets.' >&2
            exit 2
          fi

      - name: Search NFT leads and scan metadata
        run: |
          python scripts/discover_opensea_nfts.py \
            --output data/opensea_nft_discovery_report.json \
            --search-limit 50 \
            --max-nfts 100 \
            --nft-concurrency 6 \
            --timeout 10

      - name: Promote only named multi-token VRM series
        run: python scripts/promote_opensea_validated.py

      - name: Print measured yield
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/opensea_nft_discovery_report.json').read_text())
          print(json.dumps(report['summary'], indent=2))
          print('\nVALIDATED VRM NFT HITS')
          for row in report['nfts']:
              if row['validated_vrms']:
                  print(f"{row['key']}: {len(row['validated_vrms'])} {row.get('collection')}")
          PY

      - name: Rebuild public catalog if rows were admitted
        run: |
          python scripts/export_hubzz_manifest.py --validate
          python scripts/export_avatars_registry.py
          python scripts/export_hubzz_staging.py --validate
          python scripts/build_catalog.py
          python scripts/verify_catalog_consistency.py
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          node tests/catalog-ux.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: opensea-nft-high-recall-discovery
          path: data/opensea_nft_discovery_report.json

      - name: Commit admitted collections and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opensea_nft_discovery_report.json data/vrm_index.db data/discovery_leads.yaml \
            static/data static/sw.js
          if git diff --cached --quiet; then
            echo 'No OpenSea catalog changes to commit.'
            exit 0
          fi
          git commit -m 'Promote binary-validated OpenSea VRM series [skip ci]'
          git push
