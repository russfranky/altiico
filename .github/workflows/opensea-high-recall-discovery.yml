name: OpenSea high-recall VRM discovery

on:
  push:
    branches:
      - agent/opensea-high-recall-discovery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensea-high-recall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify discovery code
        run: |
          python -m py_compile scripts/opensea_client.py \
            scripts/discover_opensea_candidates.py \
            scripts/discover_opensea_nfts.py
          python -m pytest tests/test_opensea_client.py -q

      - name: Require OpenSea credential
        run: |
          if [ -z "$OPENSEA_API_KEY" ]; then
            echo 'OPENSEA_API_KEY is not configured in GitHub Actions secrets.' >&2
            exit 2
          fi

      - name: Search collection leads and scan metadata
        run: |
          python scripts/discover_opensea_candidates.py \
            --output data/opensea_discovery_report.json \
            --search-limit 50 \
            --sample 8 \
            --max-collections 500 \
            --collection-concurrency 4 \
            --timeout 10

      - name: Search NFT leads and scan metadata
        run: |
          python scripts/discover_opensea_nfts.py \
            --output data/opensea_nft_discovery_report.json \
            --search-limit 50 \
            --max-nfts 300 \
            --nft-concurrency 6 \
            --timeout 10

      - name: Print measured yield
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ('data/opensea_discovery_report.json', 'data/opensea_nft_discovery_report.json'):
              report = json.loads(Path(filename).read_text())
              print(f'\n{filename}')
              print(json.dumps(report['summary'], indent=2))
          print('\nVALIDATED VRM COLLECTION HITS')
          collections = json.loads(Path('data/opensea_discovery_report.json').read_text())
          for row in collections['collections']:
              if row['validated_vrms']:
                  print(f"{row['slug']}: {len(row['validated_vrms'])}")
          print('\nVALIDATED VRM NFT HITS')
          nfts = json.loads(Path('data/opensea_nft_discovery_report.json').read_text())
          for row in nfts['nfts']:
              if row['validated_vrms']:
                  print(f"{row['key']}: {len(row['validated_vrms'])}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: opensea-high-recall-discovery
          path: |
            data/opensea_discovery_report.json
            data/opensea_nft_discovery_report.json
