name: Direct A3AC VRM validation

on:
  push:
    branches:
      - agent/a3ac-direct-vrm-validation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a3ac-direct-vrm-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate documented A3AC metadata paths
        run: |
          python scripts/run_live_discovery.py \
            --db data/vrm_index.db \
            --targets data/a3ac_direct_validation_targets.yaml \
            --report data/a3ac_direct_validation_report.json \
            --markdown-report docs/a3ac-direct-validation-latest.md \
            --build
          python scripts/export_hubzz_staging.py --validate

      - name: Verify catalog
        run: |
          python -m pytest tests/ -q
          node tests/catalog-performance.mjs
          sqlite3 data/vrm_index.db 'PRAGMA integrity_check;'

      - name: Commit measured validation results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vrm_index.db data/a3ac_direct_validation_report.json \
            docs/a3ac-direct-validation-latest.md docs/hubzz-prealpha-staging.md \
            static/data static/sw.js
          if git diff --cached --quiet; then
            echo 'No validated catalog changes.'
            exit 0
          fi
          git commit -m 'Validate direct A3AC VRM metadata [skip ci]'
          git push
