name: Audit every VRM link

on:
  push:
    branches:
      - agent/vrm-link-audit
    paths:
      - .github/workflows/vrm-link-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vrm-link-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate auditor
        run: python -m py_compile scripts/audit_vrm_links.py

      - name: Audit concrete VRM links
        run: |
          python scripts/audit_vrm_links.py \
            --db data/vrm_index.db \
            --json-report data/vrm-link-audit.json \
            --markdown-report docs/vrm-link-audit-latest.md \
            --workers 4 \
            --timeout 30 \
            --max-attempts 3

      - name: Commit measured audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vrm-link-audit.json docs/vrm-link-audit-latest.md
          if git diff --cached --quiet; then
            echo 'Audit report already current.'
            exit 0
          fi
          git commit -m 'Audit all concrete VRM links [skip ci]'
          git push
