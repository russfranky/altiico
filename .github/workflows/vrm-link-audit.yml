name: Audit every VRM link
# Normalize legacy IPFS subdomain URLs before measuring the catalog.

on:
  push:
    branches:
      - agent/vrm-link-audit
    paths:
      - .github/workflows/vrm-link-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vrm-link-audit-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Normalize IPFS subdomain gateways
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from textwrap import dedent

          uri_path = Path('scripts/crawler/uri.py')
          text = uri_path.read_text(encoding='utf-8')
          text = text.replace(
              '    "cloudflare-ipfs.com",\n}',
              '    "cloudflare-ipfs.com",\n    "w3s.link",\n}',
          )
          replacement = dedent('''\
          def _gateway_to_ipfs(url: str) -> str | None:
              parts = urllib.parse.urlsplit(url)
              host = (parts.hostname or "").lower()

              # Path gateways: https://gateway.example/ipfs/CID/path
              if host in IPFS_GATEWAY_HOSTS:
                  marker = "/ipfs/"
                  idx = parts.path.find(marker)
                  if idx < 0:
                      return None
                  suffix = parts.path[idx + len(marker):].lstrip("/")
                  if not suffix:
                      return None
              else:
                  # Subdomain gateways: https://CID.ipfs.gateway.example/path
                  identifier = None
                  for gateway_host in sorted(IPFS_GATEWAY_HOSTS, key=len, reverse=True):
                      marker = f".ipfs.{gateway_host}"
                      if host.endswith(marker):
                          identifier = host[:-len(marker)]
                          break
                  if not identifier:
                      return None

                  raw_path = parts.path.lstrip("/")
                  # Some legacy registry rows redundantly repeat /ipfs/CID/ even
                  # though the CID is already present in the subdomain.
                  duplicate = f"ipfs/{identifier}"
                  if raw_path == duplicate:
                      raw_path = ""
                  elif raw_path.startswith(duplicate + "/"):
                      raw_path = raw_path[len(duplicate) + 1:]
                  suffix = identifier + (f"/{raw_path}" if raw_path else "")

              out = f"ipfs://{suffix}"
              if parts.query:
                  out += f"?{parts.query}"
              return out
          ''')
          pattern = r'def _gateway_to_ipfs\(url: str\) -> str \| None:\n.*?\n\ndef _gateway_to_arweave'
          updated, count = re.subn(
              pattern,
              replacement.rstrip() + '\n\ndef _gateway_to_arweave',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('IPFS gateway canonicalizer shape changed')
          uri_path.write_text(updated, encoding='utf-8')

          test_path = Path('tests/test_recursive_crawler.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = dedent('''\
          def test_common_ipfs_double_prefix_is_normalized():
              assert canonicalize_uri("ipfs://ipfs/BaSe58CID/path.json") == \\
                  "ipfs://BaSe58CID/path.json"
          ''')
          addition = dedent('''\


          def test_canonicalize_ipfs_subdomain_gateway():
              assert canonicalize_uri(
                  "https://bafybeiexample.ipfs.dweb.link/127.vrm"
              ) == "ipfs://bafybeiexample/127.vrm"


          def test_canonicalize_legacy_w3s_subdomain_gateway_with_duplicate_path():
              cid = "bafybeiexample"
              assert canonicalize_uri(
                  f"https://{cid}.ipfs.w3s.link/ipfs/{cid}/Avatar.vrm"
              ) == f"ipfs://{cid}/Avatar.vrm"
          ''')
          if 'test_canonicalize_ipfs_subdomain_gateway' not in tests:
              if anchor not in tests:
                  raise SystemExit('recursive crawler URI test shape changed')
              tests = tests.replace(anchor, anchor + addition, 1)
              test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate auditor and URI normalization
        run: |
          python -m py_compile scripts/audit_vrm_links.py scripts/crawler/uri.py
          python -m pytest tests/test_recursive_crawler.py -q

      - name: Audit concrete VRM links
        run: |
          python scripts/audit_vrm_links.py \
            --db data/vrm_index.db \
            --json-report data/vrm-link-audit.json \
            --markdown-report docs/vrm-link-audit-latest.md \
            --workers 6 \
            --timeout 20 \
            --max-attempts 2

      - name: Commit fixes and measured audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/crawler/uri.py tests/test_recursive_crawler.py \
            data/vrm-link-audit.json docs/vrm-link-audit-latest.md
          if git diff --cached --quiet; then
            echo 'Audit report already current.'
            exit 0
          fi
          git commit -m 'Normalize IPFS links and audit VRM inventory [skip ci]'
          git push
