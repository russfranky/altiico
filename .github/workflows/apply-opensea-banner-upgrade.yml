name: Apply OpenSea surface and banner upgrade

on:
  push:
    branches: [agent/opensea-full-surface-banners]
    paths:
      - scripts/_apply_opensea_banner_upgrade.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opensea-full-surface-banners
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_apply_opensea_banner_upgrade.py
      - name: Verify patch
        run: |
          python -m py_compile scripts/opensea_client.py scripts/export_hubzz_staging.py scripts/audit_opensea_surface.py
          python -m pytest tests/test_opensea_client.py -q
          python scripts/export_hubzz_staging.py --help >/dev/null
      - name: Commit patch and remove helpers
        run: |
          rm scripts/_apply_opensea_banner_upgrade.py .github/workflows/apply-opensea-banner-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use full OpenSea read surface and explicit Hubzz banners'
          git push
