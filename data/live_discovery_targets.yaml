      - "CyberBrokers (Genesis Mechs)"
      - "CyberBrokers Genesis Mechs"
    token_ids: [1]
    sample_metadata_url: "https://m.cyberbrokers.com/eth/mech/1"
    vrm_param: "vrm_url / files.glb"
    source: "a3ac-missing-contract"
    notes: "Curated A3AC lead. Attach as an alternate contract only after a token-linked VRM validates."

